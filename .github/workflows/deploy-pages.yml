# Publishes the dashboard to GitHub Pages.
#
# Runs on every push (so each weekly GSC snapshot redeploys the site) and can
# be run manually. actions/configure-pages enables the Pages site on first run.
# Live URL: https://mervsk30-cpu.github.io/equinet-seo-content-audit-3/

name: Deploy dashboard to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/seo-keyword-ranking-dashboard-dcdn52
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable and configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
