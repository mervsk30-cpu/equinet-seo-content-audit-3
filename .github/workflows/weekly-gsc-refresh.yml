# Weekly SEO ranking refresh from Google Search Console.
#
# Runs every Monday 00:15 UTC (08:15 Singapore). Pulls the last complete
# 7-day window from the GSC API, writes an immutable weekly snapshot,
# rebuilds the dashboard data, and commits both.
#
# If collection fails, the failure is recorded in data/meta.json and the
# dashboard shows an explicit error instead of presenting old data as
# current. Existing snapshots are never modified.
#
# Requires the repository secret GSC_SERVICE_ACCOUNT_JSON (see README.md).
# Note: GitHub only triggers scheduled workflows from the default branch.

name: Weekly GSC refresh

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: "Also backfill this many earlier weeks (real historical GSC data)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: weekly-gsc-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Collect weekly GSC snapshot
        id: collect
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          python scripts/collect_gsc.py --backfill "${{ github.event.inputs.backfill_weeks || '0' }}"

      - name: Rebuild dashboard data (also runs on failure to surface the error state)
        if: always()
        run: python scripts/build_dashboard_data.py

      - name: Commit and push
        if: always()
        run: |
          git config user.name "gsc-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshots data/meta.json data/dashboard-data.js data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            if [ "${{ steps.collect.outcome }}" = "success" ]; then
              git commit -m "Weekly GSC snapshot: $(date -u +%F)"
            else
              git commit -m "GSC refresh FAILED: $(date -u +%F) (error state recorded)"
            fi
            git push
          fi

      - name: Fail the job if collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
