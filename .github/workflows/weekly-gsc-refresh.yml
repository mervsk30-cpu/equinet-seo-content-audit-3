# Weekly SEO ranking refresh from Google Search Console.
#
# Runs every Monday 00:15 UTC (08:15 Singapore). Pulls the last complete
# 7-day window from the GSC API, writes an immutable weekly snapshot,
# rebuilds the dashboard data, and commits both.
#
# If collection fails, the failure is recorded in data/meta.json and the
# dashboard shows an explicit error instead of presenting old data as
# current. Existing snapshots are never modified.
#
# Requires the repository secret GSC_SERVICE_ACCOUNT_JSON (see README.md).
# Note: GitHub only triggers scheduled workflows from the default branch.

name: Weekly GSC refresh

on:
  schedule:
    - cron: "15 0 * * 1"
  workflow_dispatch:
    inputs:
      backfill_weeks:
        description: "Also backfill this many earlier weeks (real historical GSC data)"
        required: false
        default: "0"
  # Manual trigger without the Actions UI: commit a change to
  # .github/gsc-run-request (its first number = backfill weeks).
  # Useful because workflow_dispatch only works once this file is on the
  # default branch. Safe to re-trigger: existing snapshots are never
  # overwritten, so a re-run only fills gaps.
  push:
    branches:
      - main
      - claude/seo-keyword-ranking-dashboard-dcdn52
    paths:
      - ".github/gsc-run-request"

permissions:
  contents: write

concurrency:
  group: weekly-gsc-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pip install pytest
          python -m pytest tests/ -q

      - name: Collect weekly GSC snapshot
        id: collect
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        run: |
          BACKFILL="${{ github.event.inputs.backfill_weeks || '' }}"
          FORCE_FLAG=""
          if [ "${{ github.event_name }}" = "push" ] && [ -f .github/gsc-run-request ]; then
            if [ -z "$BACKFILL" ]; then
              BACKFILL=$(grep -oE '[0-9]+' .github/gsc-run-request | head -1 || true)
            fi
            # "force" re-collects existing weeks from the GSC API (same source,
            # same windows). Only for config expansions - e.g. newly tracked
            # course pages need their rows added to historical snapshots.
            if grep -qiE '(^|[[:space:]])force([[:space:]]|$)' .github/gsc-run-request; then
              FORCE_FLAG="--force"
            fi
          fi
          python scripts/collect_gsc.py --backfill "${BACKFILL:-0}" $FORCE_FLAG

      # Every step below runs even when the GSC collection fails - that is how a
      # failure gets published as an explicit error on the dashboard - but NOT
      # when collection never ran (e.g. pip/test failure), which must not
      # rebuild or push anything.
      #
      # Ahrefs supplements GSC with real SERP positions, volume and difficulty.
      # It is an independent source, so a missing AHREFS_API_KEY is not fatal:
      # the dashboard simply shows Search Console data only rather than the
      # whole weekly refresh failing.
      - name: Collect weekly Ahrefs Rank Tracker snapshot
        id: ahrefs
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        continue-on-error: true
        env:
          AHREFS_API_KEY: ${{ secrets.AHREFS_API_KEY }}
        run: |
          if [ -z "${AHREFS_API_KEY}" ]; then
            echo "::warning::AHREFS_API_KEY is not set - skipping the Ahrefs pull. The dashboard will show Google Search Console data only. Add the secret to enable Ahrefs Rank Tracker columns."
            exit 0
          fi
          python scripts/collect_ahrefs.py

      - name: Rebuild dashboard data (also runs on failure to surface the error state)
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: python scripts/build_dashboard_data.py

      - name: Commit and push
        if: always() && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure')
        run: |
          git config user.name "gsc-refresh-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/snapshots data/ahrefs-snapshots data/meta.json data/dashboard-data.js data/dashboard-data.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            if [ "${{ steps.collect.outcome }}" = "success" ]; then
              git commit -m "Weekly GSC snapshot: $(date -u +%F)"
            else
              git commit -m "GSC refresh FAILED: $(date -u +%F) (error state recorded)"
            fi
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push
          fi

      - name: Fail the job if collection failed
        if: steps.collect.outcome != 'success'
        run: exit 1
