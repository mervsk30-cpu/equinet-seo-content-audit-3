<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Equinet Academy — SEO Keyword Ranking Dashboard</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb;
    --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --baseline: #c3c2b7; --border: rgba(11,11,11,0.10);
    --series-1: #2a78d6;
    --delta-up: #006300; --delta-down: #d03b3b;
    --st-good: #0ca30c; --st-warn: #fab219; --st-serious: #ec835a; --st-critical: #d03b3b;
    --good-bg: rgba(12,163,12,0.10); --warn-bg: rgba(250,178,25,0.14);
    --serious-bg: rgba(236,131,90,0.14); --critical-bg: rgba(208,59,59,0.10);
    --neutral-bg: rgba(11,11,11,0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19;
      --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
      --series-1: #3987e5;
      --delta-up: #0ca30c; --delta-down: #d03b3b;
      --neutral-bg: rgba(255,255,255,0.07);
      --good-bg: rgba(12,163,12,0.16); --warn-bg: rgba(250,178,25,0.14);
      --serious-bg: rgba(236,131,90,0.16); --critical-bg: rgba(208,59,59,0.18);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5;
    --delta-up: #0ca30c; --delta-down: #d03b3b;
    --neutral-bg: rgba(255,255,255,0.07);
    --good-bg: rgba(12,163,12,0.16); --warn-bg: rgba(250,178,25,0.14);
    --serious-bg: rgba(236,131,90,0.16); --critical-bg: rgba(208,59,59,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .wrap { max-width: 1280px; margin: 0 auto; padding: 20px 20px 60px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .meta-line { color: var(--ink-2); font-size: 13px; margin: 2px 0 14px; }
  .meta-line b { color: var(--ink); font-weight: 600; }
  .meta-line .sep { color: var(--muted); margin: 0 6px; }
  button.ghost {
    background: none; border: 1px solid var(--border); border-radius: 8px;
    color: var(--ink-2); padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button.ghost:hover { background: var(--neutral-bg); }
  button.ghost:disabled { opacity: .4; cursor: default; }
  button.ghost:disabled:hover { background: none; }

  .pager { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 2px; font-size: 12.5px; color: var(--ink-2); }
  .pager-info { font-variant-numeric: tabular-nums; }

  .banner { border: 1px solid var(--border); border-left-width: 4px; border-radius: 8px;
    padding: 12px 14px; margin: 0 0 16px; background: var(--surface); font-size: 13.5px; }
  .banner b { font-weight: 650; }
  .banner.error   { border-left-color: var(--st-critical); background: var(--critical-bg); }
  .banner.stale   { border-left-color: var(--st-warn); background: var(--warn-bg); }
  .banner.setup   { border-left-color: var(--st-warn); background: var(--warn-bg); }
  .banner.ok      { border-left-color: var(--st-good); }
  .banner code { background: var(--neutral-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin: 0 0 18px; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px;
    font: inherit; color: inherit; text-align: left; cursor: pointer; display: block; width: 100%; }
  .tile:hover { border-color: var(--series-1); background: var(--neutral-bg); }
  .tile:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
  .tile[aria-pressed="true"] { border-color: var(--series-1); box-shadow: inset 0 0 0 1px var(--series-1); }
  .tile .v { font-size: 24px; font-weight: 650; display: block; }
  .tile .l { font-size: 12px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; }
  .tile .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  /* Live Google rank: visually distinct from the stored GSC/Ahrefs columns so
     nobody confuses a fetched-now number with a weekly one. */
  .livebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center;
    padding: 8px 10px; margin: 0 0 6px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--surface); font-size: 12px; color: var(--ink-2); }
  .livebar label { font-size: 12px; }
  .livebar select { padding: 3px 7px; font-size: 12px; }
  .livenote { color: var(--muted); }
  .livenote.err, .livebar b.err { color: var(--st-critical); }
  .livenote code { background: var(--neutral-bg); padding: 1px 5px; border-radius: 4px; }
  .live-pos { color: var(--series-1); }
  .livespin { color: var(--muted); font-size: 12px; font-style: italic; }
  .livebtn.refresh { padding: 1px 6px; margin-left: 5px; font-size: 12px; line-height: 1.2; }

  tr.typerow td { background: var(--neutral-bg); font-size: 11.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .05em; color: var(--ink-2); padding: 6px 10px; }
  tr.typerow td .n { font-weight: 600; color: var(--muted); margin-left: 4px; }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 12px; }
  .controls label { font-size: 12px; color: var(--ink-2); }
  select, input[type="search"] {
    font: inherit; font-size: 13px; color: var(--ink); background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 9px;
  }
  select:focus, input:focus { outline: 2px solid var(--series-1); outline-offset: 1px; }
  input[type="search"] { min-width: 210px; }

  .course-head { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; margin: 4px 0 10px; }
  .course-head h2 { font-size: 16px; margin: 0; }
  .course-head a { color: var(--series-1); text-decoration: none; font-size: 12.5px; word-break: break-all; }
  .course-head a:hover { text-decoration: underline; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .chip { font-size: 12px; border: 1px solid var(--border); border-radius: 999px; padding: 3px 10px;
    background: var(--surface); color: var(--ink-2); cursor: pointer; user-select: none; }
  .chip[aria-pressed="true"] { border-color: var(--series-1); color: var(--ink); box-shadow: inset 0 0 0 1px var(--series-1); }
  .chip .n { font-weight: 650; color: var(--ink); }

  .tablewrap { overflow: auto; max-height: 78vh; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  /* border-spacing (not border-collapse) is deliberate: collapsed borders
     force the browser to recompute the whole table's border geometry on
     every row insertion/removal, which is what made expanding a keyword's
     history feel like a freeze on large tables. */
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1150px; }
  td, th { border-collapse: separate; }
  th, td { text-align: left; padding: 7px 10px; border-top: 1px solid var(--grid); font-size: 13px; vertical-align: top; }
  thead th { border-top: none; font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em;
    color: var(--muted); cursor: pointer; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
  thead th.nosort { cursor: default; }
  thead th .arr { font-size: 10px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.krow:hover td { background: var(--neutral-bg); }
  tr.krow { cursor: pointer; }
  td .kw { font-weight: 550; }
  td .tag { color: var(--muted); font-size: 11px; }
  .type { font-size: 11px; color: var(--ink-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; white-space: nowrap; }
  .pos { font-weight: 650; font-size: 14px; }
  .blank { color: var(--muted); }
  .delta.up { color: var(--delta-up); font-weight: 650; }
  .delta.down { color: var(--delta-down); font-weight: 650; }
  .delta.zero { color: var(--muted); }
  .devcell { white-space: nowrap; font-variant-numeric: tabular-nums; }
  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600;
    border-radius: 6px; padding: 2px 8px; white-space: nowrap; color: var(--ink); }
  .badge .ic { font-size: 12px; }
  .b-improved { background: var(--good-bg); } .b-improved .ic { color: var(--st-good); }
  .b-newly    { background: var(--good-bg); } .b-newly .ic { color: var(--st-good); }
  .b-stable   { background: var(--neutral-bg); color: var(--ink-2); }
  .b-dropped  { background: var(--serious-bg); } .b-dropped .ic { color: var(--st-serious); }
  .b-lost     { background: var(--critical-bg); } .b-lost .ic { color: var(--st-critical); }
  .b-nodata, .b-nobase { background: var(--neutral-bg); color: var(--muted); }
  td a.rurl { color: var(--series-1); text-decoration: none; font-size: 12px;
    display: inline-block; max-width: 170px; overflow: hidden; text-overflow: ellipsis;
    white-space: nowrap; vertical-align: bottom; }
  td a.rurl:hover { text-decoration: underline; }
  td.nowrap { white-space: nowrap; }
  .livebtn { background: none; border: 1px solid var(--border); border-radius: 6px; color: var(--ink-2);
    font-size: 11.5px; padding: 3px 8px; cursor: pointer; white-space: nowrap; }
  .livebtn:hover { background: var(--neutral-bg); color: var(--ink); }

  tr.hist td { background: var(--neutral-bg); border-top: none; padding: 10px 14px 14px; cursor: default; }
  .hist-inner { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
  .hist-table { font-size: 12.5px; border-collapse: collapse; min-width: 0; }
  .hist-table th, .hist-table td { border: none; padding: 2px 12px 2px 0; font-size: 12.5px; }
  .hist-table th { color: var(--muted); text-transform: none; letter-spacing: 0; position: static; background: none; }
  .spark { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
  .spark .cap { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .empty { padding: 26px; text-align: center; color: var(--ink-2); font-size: 13.5px; }
  .note { color: var(--muted); font-size: 12px; margin: 10px 2px; }
  .courses-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; margin-bottom: 20px; }
  .ccard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 11px 13px; cursor: pointer; }
  .ccard:hover { outline: 2px solid var(--series-1); outline-offset: -1px; }
  .ccard .nm { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .ccard .st { font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; }
  .ccard .st .delta { font-size: 12px; }
  footer { margin-top: 26px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="empty" id="loading">Loading dashboard data…</div>
</div>

<script src="data/dashboard-data.js"></script>
<script>
"use strict";
(function () {
  const D = window.DASHBOARD_DATA;
  const app = document.getElementById("app");
  if (!D) {
    app.innerHTML = '<div class="banner error"><b>Dashboard data missing.</b> ' +
      'data/dashboard-data.js was not found. Run <code>python scripts/build_dashboard_data.py</code> ' +
      'and reload. No data is shown because nothing may be fabricated.</div>';
    return;
  }

  /* ---------- helpers (all display rounding happens here) ---------- */
  const rnd = p => (p === null || p === undefined) ? null : Math.floor(p + 0.5);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const fmtInt = n => (n === null || n === undefined) ? "" : n.toLocaleString("en-SG");
  const fmtPct = x => (x === null || x === undefined) ? "" : (100 * x).toFixed(1) + "%";
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function fmtShort(iso) { const d = new Date(iso + "T00:00:00Z");
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()]; }
  function fmtShortY(iso) { const d = new Date(iso + "T00:00:00Z");
    return d.getUTCDate() + " " + MONTHS[d.getUTCMonth()] + " " + d.getUTCFullYear(); }

  const STATUS = {
    improved:      { label: "Improved",        cls: "b-improved", ic: "↑" },
    dropped:       { label: "Dropped",         cls: "b-dropped",  ic: "↓" },
    newly_ranking: { label: "Newly Ranking",   cls: "b-newly",    ic: "＋" },
    lost:          { label: "Lost",            cls: "b-lost",     ic: "✕" },
    stable:        { label: "Stable",          cls: "b-stable",   ic: "＝" },
    no_ranking_data:{ label: "No Ranking Data", cls: "b-nodata",  ic: "–" },
    no_baseline:   { label: "Ranking (first week)", cls: "b-nobase", ic: "·" },
  };
  const TYPES = {
    primary:    { label: "Primary",    heading: "Primary Keywords" },
    secondary:  { label: "Secondary",  heading: "Secondary Keywords" },
    supporting: { label: "Supporting", heading: "Supporting Keywords" },
    discovered: { label: "Discovered", heading: "Discovered Keywords" },
  };
  // Fixed display order. Types with no keywords for the selected course are
  // skipped entirely rather than rendered as an empty section.
  const TYPE_ORDER = (D.type_order && D.type_order.length)
    ? D.type_order : ["primary", "secondary", "supporting", "discovered"];
  const typeLabel = t => (TYPES[t] && TYPES[t].label) || t;

  function deltaHtml(change) {
    if (change === null || change === undefined) return '<span class="blank">–</span>';
    if (change > 0) return '<span class="delta up">↑' + change + "</span>";
    if (change < 0) return '<span class="delta down">↓' + (-change) + "</span>";
    return '<span class="delta zero">0</span>';
  }
  function posHtml(p) {
    const r = rnd(p);
    return r === null ? '<span class="blank">—</span>' : '<span class="pos">#' + r + "</span>";
  }
  function devHtml(cell) {
    if (!cell) return '<span class="blank">—</span>';
    const cur = rnd(cell.position), prev = rnd(cell.previous);
    if (cur === null && prev === null) return '<span class="blank">—</span>';
    let s = "";
    if (prev !== null && cur !== null) {
      s = prev + " → " + cur + " ";
      const ch = cell.change;
      s += ch > 0 ? '<span class="delta up">(↑' + ch + ")</span>"
         : ch < 0 ? '<span class="delta down">(↓' + (-ch) + ")</span>"
         : '<span class="delta zero">(0)</span>';
    } else if (cur !== null) {
      s = "#" + cur;
    } else {
      s = prev + ' → <span class="blank">lost</span>';
    }
    return '<span class="devcell">' + s + "</span>";
  }
  function liveRankUrl(kw) {
    return "https://www.google.com.sg/search?q=" + encodeURIComponent(kw) + "&hl=en&gl=sg&pws=0&filter=0&num=100";
  }
  function pagePath(url) { try { return new URL(url).pathname; } catch (e) { return url; } }

  /* ---------- banner ---------- */
  // Build-time state is a lower bound: also check freshness against the
  // viewer's clock, so a workflow that silently stops firing still surfaces
  // as stale instead of "ok" forever.
  function effectiveState() {
    if (D.state !== "ok") return D.state;
    const due = Date.parse(D.next_refresh.date + "T00:00:00Z") + 2 * 864e5; // refresh day + 1 day grace
    return Date.now() > due ? "stale" : "ok";
  }
  function bannerHtml() {
    const lu = D.last_updated;
    if (D.state === "no_data_yet") {
      return '<div class="banner setup"><b>No ranking data yet.</b> The first Google Search Console pull has not run, ' +
        'so every ranking cell is blank — this dashboard never shows demo or estimated numbers. ' +
        'To activate: add the <code>GSC_SERVICE_ACCOUNT_JSON</code> repository secret, then run the ' +
        '<b>Weekly GSC refresh</b> GitHub Action with a backfill (e.g. 8 weeks) to load real history. ' +
        'Setup steps are in README.md. It then refreshes automatically every Monday.</div>';
    }
    if (D.state === "error") {
      return '<div class="banner error"><b>Last data refresh FAILED.</b> ' + esc(D.error || "Unknown error") +
        (lu ? ' — showing the last <b>successful</b> snapshot (' + esc(lu.display) +
        ', window ' + fmtShort(lu.window.start) + " – " + fmtShortY(lu.window.end) + "). This data is <b>not current</b>." : "") +
        "</div>";
    }
    if (effectiveState() === "stale") {
      return '<div class="banner stale"><b>Data is stale.</b> The last successful refresh was ' +
        (lu ? esc(lu.display) : "unknown") + "; a weekly Monday refresh was expected since. " +
        "The table below shows the <b>last successful week</b>, not current rankings. " +
        "Check the <b>Weekly GSC refresh</b> workflow run in GitHub Actions.</div>";
    }
    return "";
  }

  /* ---------- header meta ---------- */
  function metaHtml() {
    const lu = D.last_updated;
    let parts = [];
    if (lu) {
      parts.push("<b>Last Updated:</b> " + esc(lu.display));
      parts.push("<b>Data window:</b> " + fmtShort(lu.window.start) + " – " + fmtShortY(lu.window.end));
    } else {
      parts.push("<b>Last Updated:</b> never (awaiting first pull)");
    }
    parts.push("<b>Next Refresh:</b> " + esc(D.next_refresh.display));
    parts.push("<b>Source:</b> Google Search Console (" + esc(D.property) + ")");
    if (D.ahrefs) parts.push("<b>+ Ahrefs Rank Tracker:</b> " + esc(D.ahrefs.display));
    if (D.country) parts.push("<b>Country:</b> " + (D.country === "sgp" ? "Singapore" : esc(D.country.toUpperCase())));
    return parts.join('<span class="sep">·</span>');
  }

  /* ---------- overview tiles + course cards ---------- */
  function totals() {
    const t = { total: 0, ranking: 0, improved: 0, dropped: 0, newly_ranking: 0, lost: 0, stable: 0, no_ranking_data: 0, no_baseline: 0 };
    for (const c of D.courses) for (const k in t) t[k] += c.summary[k] || 0;
    return t;
  }
  function tilesHtml(t) {
    const tile = (id, v) => {
      const cfg = TILES[id];
      const active = state.view === "tile" && state.tile === id;
      return '<button class="tile" data-tile="' + id + '" aria-pressed="' + active + '" ' +
        'title="Show these keywords across all courses">' +
        '<span class="v">' + fmtInt(v) + "</span>" +
        '<span class="l">' + (cfg.color ? '<span class="dot" style="background:' + cfg.color + '"></span>' : "") +
        cfg.label + "</span></button>";
    };
    return '<div class="tiles">' +
      tile("total", t.total) +
      tile("ranking", t.ranking) +
      tile("improved", t.improved) +
      tile("dropped", t.dropped) +
      tile("newly_ranking", t.newly_ranking) +
      tile("lost", t.lost) +
      "</div>";
  }
  function courseCardsHtml() {
    return '<div class="courses-grid">' + D.courses.map(c => {
      const s = c.summary;
      return '<div class="ccard" data-course="' + esc(c.code) + '"><div class="nm">' + esc(c.name) + "</div>" +
        '<div class="st"><span>' + s.ranking + "/" + s.total + " ranking</span>" +
        '<span class="delta up">↑' + s.improved + "</span>" +
        '<span class="delta down">↓' + s.dropped + "</span>" +
        (s.lost ? '<span class="delta down">✕' + s.lost + "</span>" : "") +
        "</div></div>";
    }).join("") + "</div>";
  }

  /* ---------- course table ---------- */
  // Large courses can carry hundreds of tracked keywords. Rendering (and,
  // worse, mutating - e.g. expanding a row's history) a many-hundred-row
  // table in one go is what made the dashboard feel like it froze; capping
  // the rendered rows per page keeps every course fast regardless of size.
  const PAGE_SIZE = 100;

  const ahDesk = r => (r.ahrefs && r.ahrefs.desktop) || null;
  const ahMob  = r => (r.ahrefs && r.ahrefs.mobile) || null;

  /* ---------- live Google rank ----------
     A real Google search run right now, through a Worker that holds the SERP
     API key (a public static page cannot). Only the rows on screen are
     requested, and the Worker caches + budget-caps, so opening the dashboard
     cannot run up an unbounded bill. Results are never guessed: a keyword
     outside the searched depth reports "not in top N".                     */
  const LIVE_CFG = D.live_rank || {};
  const liveEnabled = !!(LIVE_CFG.endpoint && String(LIVE_CFG.endpoint).trim());
  const LIVE_BATCH_SIZE = 25;        // stays below the free Worker subrequest cap
  const LIVE = new Map();            // device + keyword -> {position, url, checked_at, ...}
  const liveInflight = new Set();    // device + keyword requests currently in flight
  let liveDevice = LIVE_CFG.device === "mobile" ? "mobile" : "desktop";
  const liveMetaByDevice = new Map();
  const liveErrorByDevice = new Map();

  function liveKey(k) { return String(k).toLowerCase().replace(/\s+/g, " ").trim(); }
  function liveStoreKey(k, device) { return (device || liveDevice) + "\n" + liveKey(k); }
  function liveEntryFresh(entry) {
    if (!entry) return false;
    // Normal results expire from their exact Google check time. Deliberately
    // stale/daily-limit responses use receipt time so they remain visible but
    // are retried after the same one-hour client window.
    const basis = entry.stale || entry.unavailable
      ? Number(entry._received_at)
      : Date.parse(entry.checked_at || "");
    const ttlMs = Math.max(60, Number(entry._cache_ttl_seconds) || 3600) * 1000;
    return Number.isFinite(basis) && Date.now() - basis < ttlMs;
  }

  async function fetchLive(keywords, opts) {
    opts = opts || {};
    if (!liveEnabled) return;
    const requestDevice = liveDevice; // device may change while fetch is running
    const want = [...new Set(keywords.map(liveKey))].filter(k => {
      const storeKey = liveStoreKey(k, requestDevice);
      const entry = LIVE.get(storeKey);
      if (entry && !liveEntryFresh(entry)) LIVE.delete(storeKey);
      return k && !liveInflight.has(storeKey) && (opts.force || !liveEntryFresh(entry));
    });
    if (!want.length) return;
    want.forEach(k => liveInflight.add(liveStoreKey(k, requestDevice)));
    // mark as loading so cells can show a spinner rather than a stale blank
    if (requestDevice === liveDevice) renderLiveCells(want, { loading: true });
    try {
      const batches = [];
      for (let i = 0; i < want.length; i += LIVE_BATCH_SIZE)
        batches.push(want.slice(i, i + LIVE_BATCH_SIZE));
      const settled = await Promise.allSettled(batches.map(async batch => {
        const headers = { "Content-Type": "application/json" };
        if (LIVE_CFG.token) headers["X-Live-Rank-Token"] = LIVE_CFG.token;
        const resp = await fetch(LIVE_CFG.endpoint, {
          method: "POST", headers,
          body: JSON.stringify({ keywords: batch, device: requestDevice, force: !!opts.force }),
        });
        if (!resp.ok) {
          let detail = null;
          try { detail = await resp.json(); } catch (_) {}
          throw new Error((detail && detail.error) || ("Live rank service returned " + resp.status));
        }
        return resp.json();
      }));

      const payloads = settled.filter(r => r.status === "fulfilled").map(r => r.value);
      const failures = settled.filter(r => r.status === "rejected").map(r => r.reason);
      for (const data of payloads) {
        const receivedAt = Date.now();
        const cacheTtl = Number(data.cache_ttl_seconds) || 3600;
        for (const [kw, val] of Object.entries(data.results || {})) {
          LIVE.set(liveStoreKey(kw, requestDevice), {
            ...val,
            _received_at: receivedAt,
            _cache_ttl_seconds: cacheTtl,
          });
        }
      }
      if (payloads.length) {
        let liveMeta = payloads.reduce((latest, data) =>
          ((data.budget && data.budget.used) || 0) >= ((latest.budget && latest.budget.used) || 0)
            ? data : latest, payloads[0]);
        if (payloads.some(data => data.budget && data.budget.exceeded))
          liveMeta = { ...liveMeta, budget: { ...liveMeta.budget, exceeded: true } };
        liveMetaByDevice.set(requestDevice, liveMeta);
      }
      liveErrorByDevice.set(requestDevice,
        failures.length ? String(failures[0].message || failures[0]) : null);
    } catch (err) {
      liveErrorByDevice.set(requestDevice, String(err.message || err));
    } finally {
      want.forEach(k => liveInflight.delete(liveStoreKey(k, requestDevice)));
      if (requestDevice === liveDevice) {
        renderLiveCells(want, {});
        updateLiveStatus();
      }
    }
  }

  function fmtClock(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d)) return "";
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    const t = d.toLocaleTimeString("en-SG", { hour: "2-digit", minute: "2-digit", hour12: false });
    return sameDay ? t : (d.getDate() + " " + MONTHS[d.getMonth()] + " " + t);
  }

  function liveCellHtml(keyword) {
    if (LIVE_CFG.blocked_reason === "artifact_sandbox")
      return '<span class="blank" title="Live checks need outbound network access, which the artifact sandbox blocks. Use the GitHub Pages dashboard.">—</span>';
    if (!liveEnabled) return '<span class="blank" title="Live rank is not configured — see serverless/README.md">—</span>';
    const k = liveKey(keyword);
    const storeKey = liveStoreKey(k);
    if (liveInflight.has(storeKey)) return '<span class="livespin" aria-live="polite">checking…</span>';
    const v = LIVE.get(storeKey);
    if (!v) return '<button class="livebtn live-one" data-kw="' + esc(keyword) + '" title="Run a real Google search now">Check</button>';
    const liveMeta = liveMetaByDevice.get(liveDevice) || null;
    const stamp = fmtClock(v.checked_at);
    if (v.error) return '<span class="devcell"><span class="delta down" title="' + esc(v.error) + '">error</span>' +
      '<button class="livebtn live-one refresh" data-kw="' + esc(keyword) + '" title="Try this live check again">↻</button>' +
      (stamp ? '<div class="tag">' + esc(stamp) + "</div>" : "") + "</span>";
    if (v.unavailable && v.budget_exceeded) return '<span class="devcell"><span class="blank" title="Daily search budget reached and no earlier result is cached">daily limit</span>' +
      '<button class="livebtn live-one refresh" data-kw="' + esc(keyword) + '" title="Try again after the daily budget resets">↻</button></span>';
    const flags = (v.mock ? ' <span class="tag" title="Mock data from the local test proxy — not a real Google result">MOCK</span>' : "") +
                  (v.stale ? ' <span class="tag" title="Daily live-search budget reached; showing the last cached check">stale cache</span>' :
                    (v.cached ? ' <span class="tag" title="Served from the one-hour Worker cache; timestamp is the original check time">cached</span>' : ""));
    const body = v.position == null
      ? '<span class="blank" title="Not found within the searched depth">not in top ' + ((liveMeta && liveMeta.settings && liveMeta.settings.depth) || 100) + "</span>"
      : '<span class="pos live-pos">#' + v.position + "</span>";
    return '<span class="devcell">' + body + flags +
      '<button class="livebtn live-one refresh" data-kw="' + esc(keyword) + '" title="Re-check this keyword on Google now">↻</button>' +
      (stamp ? '<div class="tag">' + esc(stamp) + "</div>" : "") + "</span>";
  }

  // Repaint only the live cells that changed - avoids re-rendering the table.
  function renderLiveCells(keywords, opts) {
    const set = new Set(keywords.map(liveKey));
    for (const td of app.querySelectorAll("td[data-live-kw]")) {
      const k = liveKey(td.dataset.liveKw);
      if (!set.has(k)) continue;
      td.innerHTML = liveCellHtml(td.dataset.liveKw);
    }
    wireLiveButtons();
  }

  function updateLiveStatus() {
    const el = document.getElementById("liveStatus");
    if (!el) return;
    el.innerHTML = liveStatusHtml();
    const btn = document.getElementById("liveRefreshAll");
    if (btn) btn.onclick = () => {
      const rows = visibleKeywords();
      fetchLive(rows, { force: true });
    };
    const sel = document.getElementById("liveDeviceSel");
    if (sel) sel.onchange = () => {
      liveDevice = sel.value;
      fetchLive(visibleKeywords(), {});
      render();
    };
  }

  function liveStatusHtml() {
    if (LIVE_CFG.blocked_reason === "artifact_sandbox") {
      return '<span class="livenote">Live Google Rank is unavailable on this published snapshot — the ' +
        "claude.ai artifact sandbox blocks outbound network calls. Open the GitHub Pages dashboard " +
        "for live checks; the Search Console and Ahrefs columns here are unaffected.</span>";
    }
    if (!liveEnabled) {
      return '<span class="livenote">Live Google Rank inactive — deploy the rank proxy and set ' +
        '<code>live_rank.endpoint</code> (see serverless/README.md).</span>';
    }
    const liveMeta = liveMetaByDevice.get(liveDevice) || null;
    const liveError = liveErrorByDevice.get(liveDevice) || null;
    let s = '<label for="liveDeviceSel">Live device</label> <select id="liveDeviceSel">' +
      '<option value="desktop"' + (liveDevice === "desktop" ? " selected" : "") + ">Desktop</option>" +
      '<option value="mobile"' + (liveDevice === "mobile" ? " selected" : "") + ">Mobile</option></select> " +
      '<button class="ghost" id="liveRefreshAll">↻ Re-check visible rows</button>';
    if (liveError) {
      s += '<span class="livenote err">Live check failed: ' + esc(liveError) + "</span>";
    } else if (liveMeta) {
      const st = liveMeta.settings || {};
      s += '<span class="livenote">' +
        (liveMeta.mock ? "<b>MOCK proxy</b> — not real Google data · " : "") +
        "Google " + esc(st.google_domain || "") + " · " + esc(st.location || "") +
        " · " + esc(st.language || "") + " · " + esc(liveDevice) +
        " · personalisation off · organic top " + esc(st.depth || 100) +
        (liveMeta.budget ? " · budget " + liveMeta.budget.used + "/" + liveMeta.budget.limit + " today" : "") +
        (liveMeta.budget && liveMeta.budget.exceeded ? ' <b class="err">daily budget reached — showing cached</b>' : "") +
        "</span>";
    }
    return s;
  }

  function visibleKeywords() {
    return [...app.querySelectorAll("td[data-live-kw]")].map(td => td.dataset.liveKw);
  }

  function wireLiveButtons() {
    for (const btn of app.querySelectorAll(".live-one")) {
      btn.onclick = ev => {
        ev.stopPropagation();
        fetchLive([btn.dataset.kw], { force: btn.classList.contains("refresh") });
      };
    }
  }

  // Fetch live ranks for whatever is on screen, once the table is in the DOM.
  function autoFetchVisible() {
    if (!liveEnabled || LIVE_CFG.auto_fetch_on_open === false) return;
    const kws = visibleKeywords();
    if (kws.length) fetchLive(kws, {});
  }

  const COLS = [
    { id: "course",   label: "Course",        sort: r => r.courseName || "", crossOnly: true },
    { id: "keyword",  label: "Keyword",       sort: r => r.keyword },
    { id: "type",     label: "Type",          sort: r => TYPE_ORDER.indexOf(r.type) },
    { id: "status",   label: "Status",        sort: r => Object.keys(STATUS).indexOf(r.status) },
    { id: "current",  label: "Current",       num: true, sort: r => r.current ? rnd(r.current.position) : 9999 },
    { id: "previous", label: "Previous",      num: true, sort: r => r.previous ? rnd(r.previous.position) : 9999 },
    { id: "change",   label: "Change",        num: true, sort: r => r.change === null ? -9999 : r.change, desc: true },
    { id: "live",     label: "Live Google Rank", num: true, sort: r => { const l = LIVE.get(liveStoreKey(r.keyword)); return l && liveEntryFresh(l) && l.position != null ? l.position : 9999; } },
    { id: "ahrefs",   label: "Ahrefs Rank",   num: true, sort: r => { const d = ahDesk(r); return d && d.position != null ? d.position : 9999; } },
    { id: "volume",   label: "Volume",        num: true, sort: r => (r.ahrefs && r.ahrefs.volume != null) ? r.ahrefs.volume : -1, desc: true },
    { id: "kd",       label: "KD",            num: true, sort: r => (r.ahrefs && r.ahrefs.difficulty != null) ? r.ahrefs.difficulty : -1, desc: true },
    { id: "desktop",  label: "Desktop",       sort: r => r.desktop && r.desktop.position ? rnd(r.desktop.position) : 9999, num: true },
    { id: "mobile",   label: "Mobile",        sort: r => r.mobile && r.mobile.position ? rnd(r.mobile.position) : 9999, num: true },
    { id: "impr",     label: "Impr.",         num: true, sort: r => r.current ? r.current.impressions : -1, desc: true },
    { id: "clicks",   label: "Clicks",        num: true, sort: r => r.current ? r.current.clicks : -1, desc: true },
    { id: "ctr",      label: "CTR",           num: true, sort: r => r.current ? r.current.ctr : -1, desc: true },
    { id: "url",      label: "Ranking URL",   sort: r => r.current ? r.current.page : "" },
    { id: "updated",  label: "Updated",       nosort: true },
    { id: "live",     label: "Live",          nosort: true },
  ];

  // view: "overview" (course cards) | "course" (one course) | "tile" (all
  // courses filtered by an overview tile). sortBy null = default grouping,
  // which is Primary > Secondary > Supporting > Discovered then best position.
  const state = {
    view: "overview", course: null, tile: null,
    status: "all", type: "all", q: "",
    sortBy: null, sortDesc: false, page: 1,
  };

  function currentCourse() { return D.courses.find(c => c.code === state.course) || null; }

  // Tiles map to a predicate over keyword rows, evaluated across every course.
  const TILES = {
    total:         { label: "Tracked keywords", match: () => true },
    ranking:       { label: "Currently ranking", match: r => !!r.current },
    improved:      { label: "Improved",      match: r => r.status === "improved",      color: "var(--st-good)" },
    dropped:       { label: "Dropped",       match: r => r.status === "dropped",       color: "var(--st-serious)" },
    newly_ranking: { label: "Newly ranking", match: r => r.status === "newly_ranking", color: "var(--st-good)" },
    lost:          { label: "Lost",          match: r => r.status === "lost",          color: "var(--st-critical)" },
  };

  // Flatten every course's keywords once, tagging each row with its course so
  // the cross-course tile views can show where a keyword belongs.
  let _allRows = null;
  function allRows() {
    if (_allRows) return _allRows;
    _allRows = [];
    for (const c of D.courses) {
      for (const r of c.keywords) {
        _allRows.push(Object.assign({}, r, { courseName: c.name, courseCode: c.code, courseUrl: c.url }));
      }
    }
    return _allRows;
  }

  function isCrossView() { return state.view === "tile"; }
  function activeCols() { return COLS.filter(c => !c.crossOnly || isCrossView()); }

  function defaultSort(a, b) {
    const ta = TYPE_ORDER.indexOf(a.type), tb = TYPE_ORDER.indexOf(b.type);
    if (ta !== tb) return (ta < 0 ? 99 : ta) - (tb < 0 ? 99 : tb);
    const pa = a.current ? rnd(a.current.position) : 10000;
    const pb = b.current ? rnd(b.current.position) : 10000;
    if (pa !== pb) return pa - pb;
    return a.keyword < b.keyword ? -1 : a.keyword > b.keyword ? 1 : 0;
  }

  function baseRows() {
    if (isCrossView()) {
      const tile = TILES[state.tile] || TILES.total;
      return allRows().filter(tile.match);
    }
    const course = currentCourse();
    return course ? course.keywords : [];
  }

  function filteredRows() {
    let rows = baseRows();
    if (state.status !== "all") rows = rows.filter(r => r.status === state.status);
    if (state.type !== "all") rows = rows.filter(r => r.type === state.type);
    if (state.q) { const q = state.q.toLowerCase(); rows = rows.filter(r => r.keyword.includes(q)); }
    const col = state.sortBy ? COLS.find(c => c.id === state.sortBy) : null;
    if (col && col.sort) {
      rows = rows.slice().sort((a, b) => {
        const va = col.sort(a), vb = col.sort(b);
        return (va < vb ? -1 : va > vb ? 1 : 0) * (state.sortDesc ? -1 : 1);
      });
    } else {
      rows = rows.slice().sort(defaultSort);
    }
    return rows;
  }

  function sparkSvg(history) {
    const pts = history.map((h, i) => ({ i, p: h.position === null ? null : rnd(h.position), w: h.week }))
      .filter(d => d.p !== null);
    if (pts.length < 2) return "";
    const W = 300, H = 80, PAD = 10;
    const xs = history.length - 1 || 1;
    const maxP = Math.max(...pts.map(d => d.p), 10);
    const minP = 1;
    const x = i => PAD + (W - 2 * PAD) * (i / xs);
    const y = p => PAD + (H - 2 * PAD) * ((p - minP) / (maxP - minP || 1)); // position 1 at top
    let path = "";
    let prev = null;
    for (const d of pts) {
      path += (prev === null ? "M" : "L") + x(d.i).toFixed(1) + " " + y(d.p).toFixed(1) + " ";
      prev = d;
    }
    const dots = pts.map(d =>
      '<circle cx="' + x(d.i).toFixed(1) + '" cy="' + y(d.p).toFixed(1) + '" r="4" fill="var(--series-1)">' +
      "<title>Week of " + fmtShortY(d.w) + ": #" + d.p + "</title></circle>").join("");
    return '<div class="spark"><div class="cap">Position by week (top = #1, whole positions)</div>' +
      '<svg width="' + W + '" height="' + H + '" role="img" aria-label="Weekly position trend">' +
      '<line x1="' + PAD + '" y1="' + (H - PAD) + '" x2="' + (W - PAD) + '" y2="' + (H - PAD) + '" stroke="var(--baseline)" stroke-width="1"/>' +
      '<path d="' + path.trim() + '" fill="none" stroke="var(--series-1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      dots + "</svg></div>";
  }

  function histRowHtml(r, colspan) {
    const cells = r.history.map(h => {
      const p = rnd(h.position);
      return "<tr><td>Week of " + fmtShortY(h.week) + "</td><td>" + (p === null ? "—" : "#" + p) + "</td>" +
        "<td>" + (h.impressions === null ? "—" : fmtInt(h.impressions)) + "</td>" +
        "<td>" + (h.clicks === null ? "—" : fmtInt(h.clicks)) + "</td></tr>";
    }).join("");
    const ah = r.ahrefs;
    let ahBlock = "";
    if (ah) {
      const line = (label, cell) => {
        if (!cell || cell.position == null) return "";
        const chg = (cell.change === undefined || cell.change === null) ? ""
          : " " + (cell.change > 0 ? '<span class="delta up">↑' + cell.change + "</span>"
                 : cell.change < 0 ? '<span class="delta down">↓' + (-cell.change) + "</span>"
                 : '<span class="delta zero">0</span>');
        const prev = cell.previous != null ? "#" + cell.previous + " → " : "";
        return "<tr><td>" + label + "</td><td>" + prev + "#" + cell.position + chg + "</td></tr>";
      };
      const rows2 = line("Desktop", ah.desktop) + line("Mobile", ah.mobile) +
        (ah.volume != null ? "<tr><td>Search volume</td><td>" + fmtInt(ah.volume) + "/mo</td></tr>" : "") +
        (ah.difficulty != null ? "<tr><td>Keyword difficulty</td><td>" + ah.difficulty + "/100</td></tr>" : "") +
        (ah.url ? '<tr><td>Ranking page</td><td><a class="rurl" href="' + esc(ah.url) + '" target="_blank" rel="noopener">' + esc(pagePath(ah.url)) + "</a></td></tr>" : "");
      if (rows2) {
        ahBlock = '<div class="spark"><div class="cap">Ahrefs Rank Tracker' +
          (D.ahrefs ? " · " + esc(D.ahrefs.location) + " · " + esc(D.ahrefs.display) : "") + "</div>" +
          '<table class="hist-table"><tbody>' + rows2 + "</tbody></table></div>";
      }
    }
    return '<tr class="hist"><td colspan="' + colspan + '"><div class="hist-inner">' +
      '<table class="hist-table"><thead><tr><th>Week</th><th>Position</th><th>Impressions</th><th>Clicks</th></tr></thead>' +
      "<tbody>" + cells + "</tbody></table>" + sparkSvg(r.history) + ahBlock +
      (r.lost_since ? '<div class="note">Last ranked in the week of ' + fmtShortY(r.lost_since) + ".</div>" : "") +
      "</div></td></tr>";
  }

  function pagerHtml(totalRows, page, totalPages) {
    if (totalPages <= 1) return "";
    const start = totalRows === 0 ? 0 : (page - 1) * PAGE_SIZE + 1;
    const end = Math.min(page * PAGE_SIZE, totalRows);
    return '<div class="pager">' +
      '<button class="ghost pager-prev"' + (page <= 1 ? " disabled" : "") + '>← Prev</button>' +
      '<span class="pager-info">Showing ' + fmtInt(start) + '–' + fmtInt(end) + ' of ' + fmtInt(totalRows) + ' · Page ' + page + ' of ' + totalPages + '</span>' +
      '<button class="ghost pager-next"' + (page >= totalPages ? " disabled" : "") + '>Next →</button>' +
      "</div>";
  }

  // Ahrefs cell: a real SERP position from a search check, with its own
  // week-over-week movement. Kept visually distinct from the Search Console
  // average-position columns because they measure different things.
  function ahrefsHtml(r) {
    const d = ahDesk(r), m = ahMob(r);
    const pos = d && d.position != null ? d.position : (m && m.position != null ? m.position : null);
    if (pos === null) return '<span class="blank">—</span>';
    const src = (d && d.position != null) ? d : m;
    let s = '<span class="pos">#' + pos + "</span>";
    if (src.change !== undefined && src.change !== null) {
      s += " " + (src.change > 0 ? '<span class="delta up">↑' + src.change + "</span>"
                : src.change < 0 ? '<span class="delta down">↓' + (-src.change) + "</span>"
                : '<span class="delta zero">0</span>');
    }
    // Flag when the ranking page is not this course's page (another page of
    // the site is winning the keyword) - real, actionable signal.
    if (r.ahrefs && r.ahrefs.on_this_course === false && !isCrossView()) {
      s += ' <span class="tag" title="Ahrefs reports this keyword ranking on a different page of the site">↗ other page</span>';
    }
    return '<span class="devcell">' + s + "</span>";
  }

  function typeHeaderRow(type, count, colspan) {
    const heading = (TYPES[type] && TYPES[type].heading) || typeLabel(type);
    return '<tr class="typerow"><td colspan="' + colspan + '">' +
      esc(heading) + ' <span class="n">' + fmtInt(count) + "</span></td></tr>";
  }

  function tableHtml() {
    const cols = activeCols();
    const rowsAll = filteredRows();
    const totalPages = Math.max(1, Math.ceil(rowsAll.length / PAGE_SIZE));
    if (state.page > totalPages) state.page = totalPages;
    if (state.page < 1) state.page = 1;
    const startIdx = (state.page - 1) * PAGE_SIZE;
    const rows = rowsAll.slice(startIdx, startIdx + PAGE_SIZE);
    const luDate = D.last_updated ? fmtShortY(D.last_updated.run_date) : "";
    const head = cols.map(c =>
      "<th" + (c.num ? ' class="num"' : "") + (c.nosort ? ' class="nosort"' : ' data-sort="' + c.id + '"') + ">" +
      c.label + (state.sortBy === c.id ? ' <span class="arr">' + (state.sortDesc ? "▼" : "▲") + "</span>" : "") +
      "</th>").join("");

    // Section headers only make sense while the rows are in type order, i.e.
    // under the default sort. Any explicit column sort turns them off.
    const grouped = !state.sortBy;
    const typeCounts = {};
    if (grouped) for (const r of rowsAll) typeCounts[r.type] = (typeCounts[r.type] || 0) + 1;

    let lastType = null;
    const body = rows.map((r, localIdx) => {
      const idx = startIdx + localIdx; // global index into rowsAll, matched by wireTable
      const st = STATUS[r.status] || STATUS.no_ranking_data;
      const cur = r.current, prev = r.previous;
      const ah = r.ahrefs || {};
      let out = "";
      if (grouped && r.type !== lastType) {
        lastType = r.type;
        out += typeHeaderRow(r.type, typeCounts[r.type] || 0, cols.length);
      }
      out += '<tr class="krow" data-i="' + idx + '">' +
        (isCrossView()
          ? '<td><a class="rurl" href="' + esc(r.courseUrl) + '" target="_blank" rel="noopener">' + esc(r.courseName) + "</a></td>"
          : "") +
        '<td><span class="kw">' + esc(r.keyword) + "</span>" +
          (r.team_tag ? '<div class="tag">' + esc(r.team_tag) + "</div>" : "") + "</td>" +
        '<td><span class="type">' + esc(typeLabel(r.type)) + "</span></td>" +
        '<td><span class="badge ' + st.cls + '"><span class="ic">' + st.ic + "</span>" + st.label + "</span>" +
          (r.status === "lost" && r.lost_since ? '<div class="tag">since ' + fmtShort(r.lost_since) + "</div>" : "") + "</td>" +
        '<td class="num">' + posHtml(cur ? cur.position : null) + "</td>" +
        '<td class="num">' + posHtml(prev ? prev.position : null) + "</td>" +
        '<td class="num">' + deltaHtml(r.change) + "</td>" +
        '<td class="num" data-live-kw="' + esc(r.keyword) + '">' + liveCellHtml(r.keyword) + "</td>" +
        '<td class="num">' + ahrefsHtml(r) + "</td>" +
        '<td class="num">' + (ah.volume != null ? fmtInt(ah.volume) : '<span class="blank">—</span>') + "</td>" +
        '<td class="num">' + (ah.difficulty != null ? ah.difficulty : '<span class="blank">—</span>') + "</td>" +
        '<td class="num">' + devHtml(r.desktop) + "</td>" +
        '<td class="num">' + devHtml(r.mobile) + "</td>" +
        '<td class="num">' + (cur ? fmtInt(cur.impressions) : '<span class="blank">—</span>') + "</td>" +
        '<td class="num">' + (cur ? fmtInt(cur.clicks) : '<span class="blank">—</span>') + "</td>" +
        '<td class="num">' + (cur ? fmtPct(cur.ctr) : '<span class="blank">—</span>') + "</td>" +
        "<td>" + (cur ? '<a class="rurl" href="' + esc(cur.page) + '" target="_blank" rel="noopener">' + esc(pagePath(cur.page)) + "</a>" : '<span class="blank">—</span>') + "</td>" +
        '<td class="num nowrap">' + (cur ? luDate : '<span class="blank">—</span>') + "</td>" +
        '<td><button class="livebtn" data-kw="' + esc(r.keyword) + '" title="Open a Google search for this keyword (Singapore, no personalisation) to verify the live position manually">Check live</button></td>' +
        "</tr>";
      return out;
    }).join("");

    return '<div class="table-section">' +
      '<div class="livebar" id="liveStatus">' + liveStatusHtml() + "</div>" +
      pagerHtml(rowsAll.length, state.page, totalPages) +
      '<div class="tablewrap"><table><thead><tr>' + head + "</tr></thead><tbody>" +
      (body || '<tr><td colspan="' + cols.length + '"><div class="empty">No keywords match the current filters.</div></td></tr>') +
      "</tbody></table></div>" +
      pagerHtml(rowsAll.length, state.page, totalPages) +
      '<p class="note"><b>Live Google Rank</b> is a real Google search run at the moment shown, using Singapore settings (organic results only — ads, map packs and AI overviews are not counted, so your result may sit lower on the page than the number suggests). ' +
      '<b>Current / Previous / Change / Desktop / Mobile / Impr. / Clicks / CTR</b> come from Google Search Console ' +
      "(average position across impressions, shown as whole numbers). " +
      "<b>Ahrefs Rank / Volume / KD</b> come from Ahrefs Rank Tracker" +
      (D.ahrefs ? " (" + esc(D.ahrefs.location) + ", checked " + esc(D.ahrefs.display) + ")" : "") +
      " — an actual SERP position from a real search check. The two are different measurements and are never averaged together. " +
      "Blank cells mean that source returned no data — nothing is estimated. " +
      "Expand a row for weekly history. “Check live” opens a manual Google search. " +
      esc(D.discovered_keyword_policy || "") +
      "</p></div>";
  }

  function chipsHtml(course) {
    const s = course.summary;
    const chip = (id, label, n) =>
      '<button class="chip" data-status="' + id + '" aria-pressed="' + (state.status === id) + '">' +
      label + ' <span class="n">' + n + "</span></button>";
    return '<div class="chips">' +
      chip("all", "All", s.total) +
      chip("improved", "↑ Improved", s.improved) +
      chip("dropped", "↓ Dropped", s.dropped) +
      chip("newly_ranking", "＋ Newly Ranking", s.newly_ranking) +
      chip("lost", "✕ Lost", s.lost) +
      chip("stable", "＝ Stable", s.stable) +
      chip("no_ranking_data", "– No Ranking Data", s.no_ranking_data) +
      (s.no_baseline ? chip("no_baseline", "· First week", s.no_baseline) : "") +
      "</div>";
  }

  /* ---------- render ---------- */
  function render() {
    const course = currentCourse();
    const t = totals();
    let html = "";
    html += '<header class="top"><div><h1>SEO Keyword Ranking Dashboard</h1>' +
      '<div class="sub">Equinet Academy course landing pages · weekly Google Search Console data</div></div>' +
      '<button class="ghost" id="themeBtn">Toggle theme</button></header>';
    html += '<div class="meta-line">' + metaHtml() + "</div>";
    html += bannerHtml();
    html += tilesHtml(t);

    const showTable = state.view === "course" || state.view === "tile";
    html += '<div class="controls"><label for="courseSel">Course</label> ' +
      '<select id="courseSel"><option value="">All courses — overview</option>' +
      D.courses.map(c => '<option value="' + esc(c.code) + '"' + (state.view === "course" && state.course === c.code ? " selected" : "") + ">" +
        esc(c.name) + "</option>").join("") + "</select>";
    if (showTable) {
      html += '<label for="typeSel">Type</label> <select id="typeSel">' +
        '<option value="all">All types</option>' +
        TYPE_ORDER.map(v => '<option value="' + v + '"' + (state.type === v ? " selected" : "") + ">" + esc(typeLabel(v)) + "</option>").join("") +
        "</select>" +
        '<input type="search" id="kwSearch" placeholder="Search keywords…" value="' + esc(state.q) + '">';
    }
    html += "</div>";

    if (state.view === "tile") {
      const cfg = TILES[state.tile] || TILES.total;
      const n = filteredRows().length;
      html += '<div class="course-head"><h2>' + esc(cfg.label) + " — all courses</h2>" +
        '<span class="sub">' + fmtInt(n) + " keyword" + (n === 1 ? "" : "s") + " across " +
        fmtInt(new Set(filteredRows().map(r => r.courseCode)).size) + " courses</span>" +
        '<button class="ghost" id="backBtn">← Back to overview</button></div>';
      html += tableHtml();
    } else if (state.view === "course" && course) {
      html += '<div class="course-head"><h2>' + esc(course.name) + "</h2>" +
        '<a href="' + esc(course.url) + '" target="_blank" rel="noopener">' + esc(course.url) + "</a></div>";
      html += chipsHtml(course);
      html += tableHtml();
    } else {
      html += courseCardsHtml();
    }
    html += "<footer>Sources: Google Search Console API" +
      (D.ahrefs ? " + Ahrefs Rank Tracker" : "") + " · Refreshed every Monday · " +
      "Snapshots are immutable weekly records · " +
      esc(D.data_policy) + "</footer>";
    app.innerHTML = html;
    wire(course);
  }

  function wire(course) {
    document.getElementById("themeBtn").onclick = () => {
      const root = document.documentElement;
      const dark = root.getAttribute("data-theme") === "dark" ||
        (root.getAttribute("data-theme") !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", dark ? "light" : "dark");
    };
    for (const tile of app.querySelectorAll(".tile[data-tile]")) {
      tile.onclick = () => {
        const id = tile.dataset.tile;
        if (state.view === "tile" && state.tile === id) {   // click again to close
          state.view = "overview"; state.tile = null;
        } else {
          state.view = "tile"; state.tile = id; state.course = null;
        }
        state.status = "all"; state.type = "all"; state.q = "";
        state.sortBy = null; state.sortDesc = false; state.page = 1;
        render();
      };
    }
    const back = document.getElementById("backBtn");
    if (back) back.onclick = () => {
      state.view = "overview"; state.tile = null; state.page = 1; render();
    };
    const sel = document.getElementById("courseSel");
    if (sel) sel.onchange = () => {
      state.course = sel.value || null;
      state.view = state.course ? "course" : "overview";
      state.tile = null; state.status = "all"; state.type = "all"; state.q = "";
      state.sortBy = null; state.sortDesc = false; state.page = 1;
      render();
    };
    for (const card of app.querySelectorAll(".ccard")) {
      card.onclick = () => {
        state.course = card.dataset.course; state.view = "course"; state.tile = null;
        state.status = "all"; state.type = "all"; state.q = "";
        state.sortBy = null; state.sortDesc = false; state.page = 1;
        render();
      };
    }
    if (state.view !== "course" && state.view !== "tile") return;
    const typeSel = document.getElementById("typeSel");
    if (typeSel) typeSel.onchange = () => { state.type = typeSel.value; state.page = 1; render(); };
    const search = document.getElementById("kwSearch");
    if (search) {
      search.oninput = () => { state.q = search.value.trim().toLowerCase(); state.page = 1; rerenderTable(); };
    }
    for (const chip of app.querySelectorAll(".chip")) {
      chip.onclick = () => { state.status = chip.dataset.status; state.page = 1; render(); };
    }
    wireTable();
  }

  function rerenderTable() {
    const wrap = app.querySelector(".table-section");
    if (!wrap) return;
    const container = document.createElement("div");
    container.innerHTML = tableHtml();
    wrap.replaceWith(container.querySelector(".table-section"));
    wireTable();
    const search = document.getElementById("kwSearch");
    if (search) search.focus();
  }

  function wireTable() {
    const colCount = activeCols().length;
    for (const th of app.querySelectorAll("thead th[data-sort]")) {
      th.onclick = () => {
        const id = th.dataset.sort;
        const col = COLS.find(c => c.id === id);
        // third click on the same column returns to the default type grouping
        if (state.sortBy === id && state.sortDesc !== !!col.desc) {
          state.sortBy = null; state.sortDesc = false;
        } else if (state.sortBy === id) {
          state.sortDesc = !state.sortDesc;
        } else {
          state.sortBy = id; state.sortDesc = !!col.desc;
        }
        state.page = 1;
        render();
      };
    }
    const rows = filteredRows();
    for (const tr of app.querySelectorAll("tr.krow")) {
      tr.onclick = ev => {
        if (ev.target.closest("a") || ev.target.closest("button")) return;
        const existing = tr.nextElementSibling;
        if (existing && existing.classList.contains("hist")) { existing.remove(); return; }
        for (const h of app.querySelectorAll("tr.hist")) h.remove();
        const r = rows[Number(tr.dataset.i)];
        if (!r || !r.history || !r.history.length) return;
        tr.insertAdjacentHTML("afterend", histRowHtml(r, colCount));
      };
    }
    for (const btn of app.querySelectorAll(".livebtn")) {
      btn.onclick = ev => {
        ev.stopPropagation();
        window.open(liveRankUrl(btn.dataset.kw), "_blank", "noopener");
      };
    }
    for (const btn of app.querySelectorAll(".pager-prev")) {
      btn.onclick = () => { state.page -= 1; rerenderTable(); };
    }
    for (const btn of app.querySelectorAll(".pager-next")) {
      btn.onclick = () => { state.page += 1; rerenderTable(); };
    }
    wireLiveButtons();
    updateLiveStatus();
    autoFetchVisible();
  }

  render();
})();
</script>
</body>
</html>
